<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拼音挑戰 - 趣味學中文</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 10px; background-color: #fdf6e3; margin: 0; min-height: 100vh; position: relative; overflow-x: hidden; box-sizing: border-box; }
        .full-width { width: 100%; max-width: 600px; text-align: center; margin-top: 5px; }
        
        #timer { 
            position: fixed; top: 15px; right: 15px; font-size: 18px; font-weight: bold; 
            color: #8b4513; background: white; padding: 5px 10px; border-radius: 10px; 
            border: 2px solid #8b4513; z-index: 1000;
        }

        #attempts { 
            position: fixed; top: 15px; left: 15px; font-size: 18px; font-weight: bold; 
            color: #8b4513; background: white; padding: 5px 10px; border-radius: 10px; 
            border: 2px solid #8b4513; z-index: 1000;
        }

        h2 { color: #8b4513; margin: 8px 0; font-size: 22px; }
        
        .action-container { margin: 8px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .yt-link { text-decoration: none; padding: 6px 12px; background: #9f062a; color: white; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .audio-btn { padding: 6px 12px; background: #2196f3; color: white; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .preview-btn { padding: 6px 12px; background: #080598; color: white; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; }
        
        .grid-container { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 10px 0; align-items: center; }
        .slot { width: 45px; height: 45px; border: 2px dashed #8b4513; display: flex; align-items: center; justify-content: center; background-color: #fff; border-radius: 6px; font-weight: bold; font-size: 22px; color: #333; }
        
        .instruction { color: #5d6d7e; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        
        #tetris-container {
            width: 100%; max-width: 100%; height: 120px; background-color: #ffffff;
            border-radius: 8px; position: relative; overflow: hidden; margin-top: 5px;
            border: 2px solid #8b4513; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tetris-block {
            position: absolute; display: flex; gap: 6px; justify-content: center; left: 50%;
            transform: translateX(-50%); transition: top 0.05s linear; width: 95%;
        }

        .tetris-word {
            width: 40px; height: 48px; background-color: #8b4513; color: #ffffff;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-size: 20px; font-weight: bold; border-radius: 8px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2); user-select: none; flex-shrink: 0;
        }
        .tetris-word:hover { background-color: #a0522d; }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .action-btn { padding: 8px 18px; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; font-weight: bold; }
        #undo-btn { background: #f39c12; color: white; }
        #reset-btn { background: #ff5722; color: white; display: none; }

        #home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 75vh; text-align: center; }
        #home-screen h1 { color: #8b4513; font-size: 28px; margin-bottom: 20px; }
        .start-btn { padding: 15px 30px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .start-btn:hover { background-color: #219653; }
        
        #game-screen { display: none; width: 100%; }
        #word-display { font-size: 35px; font-weight: bold; color: #d84315; margin: 5px 0; cursor: pointer; }

        @media screen and (max-width: 400px) {
            .tetris-word { width: 34px; height: 42px; font-size: 17px; }
            .slot { width: 35px; height: 35px; font-size: 18px; }
        }
    </style>
</head>
<body>

<div id="attempts">次數：0</div>
<div id="timer">時間：00:00</div>

<div id="home-screen" class="full-width">
    <h1>📜 拼音挑戰遊戲</h1>
    <p class="instruction" style="font-size: 18px; margin-bottom: 30px;">趣味學中文：發音挑戰</p>
    <button class="start-btn" onclick="startGame()">開始遊戲</button>
</div>

<div id="game-screen" class="full-width">
    <h2 id="word-title">拼音挑戰</h2>
    <div id="word-display" onclick="speakCurrentWord()" title="點擊發音"></div>
    
    <div class="action-container">
        <button class="audio-btn" onclick="speakCurrentWord()">🔊 讀出發音</button>
        <a href="https://www.youtube.com/shorts/TpWftwKlV8E" target="_blank" class="yt-link">🎥 觀看影片</a>
        <button class="preview-btn" onclick="showPreview()">📖 提示</button>
    </div>

    <div class="instruction">請點選下方掉落框框裡的字，依序填入上方的空格中</div>

    <div id="slots" class="grid-container"></div>
    
    <div id="tetris-container"></div>
    
    <div class="btn-group">
        <button id="undo-btn" class="action-btn" onclick="undoLast()">⟲ 更正</button>
        <button id="reset-btn" class="action-btn" onclick="resetGame()">再玩一次</button>
    </div>
</div>

<script>
    const clickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2573/2573-preview.mp3');
    
    const baseItems = [
        { label: "請聽語音選出", pinyin: ["ㄒ"], speakText: "西" },
        { label: "請聽語音選出", pinyin: ["ㄩ"], speakText: "淤" },
        { label: "請聽語音選出 (鬍鬚)", pinyin: ["ㄒ", "ㄩ"], speakText: "虛" },
        { label: "請聽語音選出", pinyin: ["ㄩ", "ˇ"], speakText: "雨" },
        { label: "請聽語音選出 (許願)", pinyin: ["ㄒ", "ㄩ", "ˇ"], speakText: "許" },
        { label: "請聽語音選出", pinyin: ["ㄧ", "ㄝ"], speakText: "耶" },
        { label: "請聽語音選出 (蠍子)", pinyin: ["ㄒ", "ㄧ", "ㄝ"], speakText: "蠍" }
    ];

    const symbols = ["ㄅ", "ㄆ", "ㄇ", "ㄈ", "ㄉ", "ㄊ", "ㄋ", "ㄌ", "ㄍ", "ㄎ", "ㄏ", "ㄐ", "ㄑ", "ㄒ", "ㄓ", "ㄔ", "ㄕ", "ㄖ", "ㄗ", "ㄘ", "ㄙ", "ㄚ", "ㄛ", "ㄜ", "ㄝ", "ㄞ", "ㄟ", "ㄠ", "ㄡ", "ㄢ", "ㄣ", "ㄤ", "ㄥ", "ㄦ", "ㄧ", "ㄨ", "ㄩ"];
    const tones = ["˙", "ˊ", "ˇ", "ˋ", "¯"];

    let currentIdx = 0;
    let totalAttempts = 0; // 累積答對的題數（闖關次數）
    let shuffledItems = [];
    let blocksData = []; 
    let activeBlock = null; 
    let gameInterval = null;
    let seconds = 0, timerStarted = false, timerInterval = null;

    function formatTime(s) {
        const m = Math.floor(s / 60).toString().padStart(2, '0');
        const sec = (s % 60).toString().padStart(2, '0');
        return `時間：${m}:${sec}`;
    }

    function speakCurrentWord() {
        if (currentIdx < shuffledItems.length) {
            const textToSpeak = shuffledItems[currentIdx].speakText;
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.8; 
            window.speechSynthesis.speak(utterance);
        }
    }

    function startGame() {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        
        shuffledItems = [...baseItems].sort(() => Math.random() - 0.5);
        currentIdx = 0;
        document.getElementById('attempts').innerText = `次數：${totalAttempts}`;
        initItem();
    }

    function resetGame() {
        if (gameInterval) clearInterval(gameInterval);
        if (timerInterval) clearInterval(timerInterval);
        seconds = 0;
        timerStarted = false;
        currentIdx = 0;
        
        document.getElementById('timer').innerText = formatTime(seconds);
        document.getElementById('attempts').innerText = `次數：${totalAttempts}`;
        
        document.getElementById('tetris-container').style.display = 'block';
        document.getElementById('reset-btn').style.display = 'none';
        document.getElementById('undo-btn').style.display = 'inline-block';
        if (activeBlock && activeBlock.element) activeBlock.element.remove();
        
        shuffledItems = [...baseItems].sort(() => Math.random() - 0.5);
        initItem();
    }

    function undoLast() {
        const filled = document.querySelectorAll('.slot[id="filled"]');
        if (filled.length > 0) {
            const lastSlot = filled[filled.length - 1];
            const charToReturn = lastSlot.dataset.char;
            
            lastSlot.textContent = "";
            lastSlot.removeAttribute('id');
            lastSlot.style.backgroundColor = "#fff";

            if (activeBlock) {
                activeBlock.chars.push(charToReturn);
                updateBlockDOM(activeBlock.element, activeBlock.chars);
            } else {
                if (blocksData.length > 0) {
                    blocksData[0].unshift(charToReturn);
                } else {
                    blocksData.push([charToReturn]);
                    spawnNextBlock();
                }
            }
        }
    }

    function showPreview() {
        const slots = document.querySelectorAll('.empty-slot');
        slots.forEach(slot => {
            if (slot.id !== "filled") {
                slot.textContent = slot.dataset.char;
                slot.style.backgroundColor = "#e0d0b0";
            }
        });
        setTimeout(() => {
            slots.forEach(slot => {
                if (slot.id !== "filled") {
                    slot.textContent = "";
                    slot.style.backgroundColor = "#fff";
                }
            });
        }, 3000); 
    }

    function startTimerIfNeeded() {
        if (!timerStarted) {
            timerStarted = true;
            timerInterval = setInterval(() => {
                seconds++;
                document.getElementById('timer').innerText = formatTime(seconds);
            }, 1000);
        }
    }

    function initItem() {
        if (currentIdx >= shuffledItems.length) {
            finishGame();
            return;
        }

        const item = shuffledItems[currentIdx];
        document.getElementById('word-display').innerText = item.label;
        
        setTimeout(speakCurrentWord, 300);

        const slotsDiv = document.getElementById('slots');
        slotsDiv.innerHTML = '';
        
        item.pinyin.forEach((char) => {
            let slot = document.createElement('div');
            slot.className = 'slot empty-slot';
            slot.dataset.char = char;
            slotsDiv.appendChild(slot);
        });

        let pinyinArr = [...item.pinyin];
        let pool = [...symbols, ...tones].filter(s => !pinyinArr.includes(s));
        pool.sort(() => Math.random() - 0.5);
        
        let blockChars = [...pinyinArr];
        while(blockChars.length < 7 && pool.length > 0) {
            blockChars.push(pool.pop());
        }
        blockChars.sort(() => Math.random() - 0.5);
        
        blocksData = [blockChars];
        spawnNextBlock();
    }

    function spawnNextBlock() {
        if (blocksData.length === 0) return;

        const container = document.getElementById('tetris-container');
        container.innerHTML = ''; 
        
        let chars = blocksData.shift();
        let blockDiv = document.createElement('div');
        blockDiv.className = 'tetris-block';
        
        function renderChars() {
            blockDiv.innerHTML = '';
            chars.forEach((char) => {
                let wordDiv = document.createElement('div');
                wordDiv.className = 'tetris-word';
                wordDiv.textContent = char;
                
                wordDiv.onclick = function(e) {
                    e.stopPropagation();
                    clickSound.currentTime = 0;
                    clickSound.play();
                    startTimerIfNeeded();
                    
                    let targetSlot = document.querySelector('.empty-slot:not([id="filled"])');
                    if (targetSlot && char === targetSlot.dataset.char) {
                        targetSlot.textContent = char;
                        targetSlot.id = "filled";
                        targetSlot.style.backgroundColor = "#fff";
                        
                        const charIndex = chars.indexOf(char);
                        if (charIndex > -1) chars.splice(charIndex, 1);
                        
                        if (chars.length === 0 || document.querySelectorAll('.empty-slot:not([id="filled"])').length === 0) {
                            if (gameInterval) clearInterval(gameInterval);
                            blockDiv.remove();
                            activeBlock = null;
                            
                            // 每答對一題，闖關次數加 1，並立即更新顯示
                            totalAttempts++;
                            document.getElementById('attempts').innerText = `次數：${totalAttempts}`;
                            
                            setTimeout(() => {
                                currentIdx++;
                                initItem();
                            }, 600);
                        } else {
                            renderChars();
                        }
                    }
                };
                blockDiv.appendChild(wordDiv);
            });
        }

        renderChars();
        container.appendChild(blockDiv);

        let currentY = -60;
        let targetY = 35; 
        blockDiv.style.top = currentY + 'px';

        activeBlock = { element: blockDiv, chars: chars };

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(() => {
            if (currentY < targetY) {
                currentY += 4; 
                blockDiv.style.top = currentY + 'px';
            } else {
                clearInterval(gameInterval);
            }
        }, 30);
    }

    function updateBlockDOM(blockDiv, chars) {
        blockDiv.innerHTML = '';
        chars.forEach((char) => {
            let wordDiv = document.createElement('div');
            wordDiv.className = 'tetris-word';
            wordDiv.textContent = char;
            
            wordDiv.onclick = function(e) {
                e.stopPropagation();
                clickSound.currentTime = 0;
                clickSound.play();
                startTimerIfNeeded();
                
                let targetSlot = document.querySelector('.empty-slot:not([id="filled"])');
                if (targetSlot && char === targetSlot.dataset.char) {
                    targetSlot.textContent = char;
                    targetSlot.id = "filled";
                    targetSlot.style.backgroundColor = "#fff";
                    
                    const charIndex = chars.indexOf(char);
                    if (charIndex > -1) chars.splice(charIndex, 1);
                    
                    if (chars.length === 0) {
                        blockDiv.remove();
                        activeBlock = null;
                    } else {
                        updateBlockDOM(blockDiv, chars);
                    }
                }
            };
            blockDiv.appendChild(wordDiv);
        });
    }

    function finishGame() {
        if (gameInterval) clearInterval(gameInterval);
        if (timerInterval) clearInterval(timerInterval);
        if (activeBlock && activeBlock.element) activeBlock.element.remove();
        
        const msg = new SpeechSynthesisUtterance("太棒了，挑戰完成！");
        msg.lang = 'zh-TW';
        window.speechSynthesis.speak(msg);
        
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
        
        document.getElementById('word-display').innerText = "全部闖關成功！";
        document.getElementById('slots').innerHTML = '';
        document.getElementById('tetris-container').style.display = 'none';
        document.getElementById('reset-btn').style.display = 'inline-block';
        document.getElementById('undo-btn').style.display = 'none';
    }
</script>
</body>
</html>
